spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# Render Spring MVC's built-in exceptions (validation, malformed body, bad enum/UUID)
# as RFC 9457 application/problem+json, matching the Ingredients API contract.
spring.mvc.problemdetails.enabled=true

# When true, IngredientBootstrapRunner upserts ingredients.json into the DB on startup.
# Opt-in: leave false for normal runs.
recipe.bootstrap.enabled=false

# Minimal demo authentication (HTTP Basic). A single built-in user holding all roles.
# Override the password per-environment via the SPRING_SECURITY_USER_PASSWORD env var;
# do not rely on this default outside local/demo use.
spring.security.user.name=recipes
spring.security.user.password=recipes-demo
spring.security.user.roles=USER,ADMIN
