# Default test DB: fast, Docker-free in-memory H2 in PostgreSQL-compatibility mode.
# CASE_INSENSITIVE_IDENTIFIERS makes H2 match identifiers (including quoted ones)
# case-insensitively, so the mixed casing Spring Data JDBC's H2 dialect emits
# (lowercase-quoted table, uppercase-quoted columns) resolves against the schema.
#
# The `postgres` Maven profile overrides spring.datasource.* to a Testcontainers
# JDBC URL, so the SAME test runs against a real Postgres. Liquibase runs in both.
spring.datasource.url=jdbc:h2:mem:recipes;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Never let the dev docker-compose support kick in during tests.
spring.docker.compose.enabled=false

# Use the test master changelog, which layers the H2 json-type override on top of
# the production changelog. Applies to both the H2 and the Postgres test runs.
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-test-master.xml

# Seed on startup so the test exercises the real ApplicationRunner path.
recipe.bootstrap.enabled=true
